# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # 获取完整 Git 历史，用于 Changesets 正确计算版本
          fetch-depth: 0
          # 使用具有写权限的 PAT，用于推送 commit 和 tags
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.12.0
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
        env:
          # 用于 npm 登录（兼容部分工具链）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # # 构建产物（dist/）应在 .gitignore 中，避免污染工作区 changeset version 之后build
      # - name: Build Packages
      #   run: pnpm run build:all

      # 调试：查看当前 changeset 状态（仅用于诊断）
      - name: Debug Changesets (Before)
        run: |
          echo "=== .changeset content ==="
          ls -la .changeset/
          if ls .changeset/*.md >/dev/null 2>&1; then
            cat .changeset/*.md
          fi
          echo "=== config.json ==="
          cat .changeset/config.json
          echo "=== package versions ==="
          grep '"version"' packages/*/package.json

      # 检测是否存在未处理的 changeset
      - name: Check for changesets
        id: check_changesets
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      # 仅当有 changeset 时才配置 Git 并发布
      - name: Configure Git User
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


      - name: Debug Git Status Before Version
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          if [ -n " $(git status --porcelain)" ]; then
            echo "❌ Working directory is dirty before changeset version:"
            git status --porcelain
            exit 1
          fi

      - name: Publish packages
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          # 1. Bump versions, update CHANGELOGs, commit, and delete changeset files
          pnpm exec changeset version

          # 2. Rebuild with new package.json versions (critical for correct dist metadata)
          pnpm run build:all

          # 3. Push the version commit and Git tags to GitHub
          git push origin main --follow-tags

          # 4. Publish updated packages to npm
          pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 可选：发布后调试（便于排查问题）
      - name: Debug Changesets (After)
        if: always() && steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          echo "=== Final package versions ==="
          grep '"version"' packages/*/package.json
          echo "=== .changeset directory after publish ==="
          ls -la .changeset/