# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # 获取完整 Git 历史，用于 Changesets 正确计算版本
          fetch-depth: 0
          # 使用具有写权限的 PAT，用于推送 commit 和 tags
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      # 设置 PNPM 和 Node.js 环境 注意和开发环境版本保持一致，否则可能导致依赖问题
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.12.0
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
        env:
          # 用于 npm 登录（兼容部分工具链）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # # 构建产物（dist/）应在 .gitignore 中，避免污染工作区 changeset version 之后build
      # - name: Build Packages
      #   run: pnpm run build:all

      # 检测是否存在未处理的 changeset
      - name: Check for changesets
        id: check_changesets
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      # 仅当有 changeset 时才配置 Git 并发布
      - name: Configure Git User
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 工作区干净检查
      - name: Ensure clean working directory before versioning
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Working directory is dirty before changeset version:"
            git status --porcelain
            exit 1
          fi

      # START：release PR 模式： changeset自动提 PR → 人工合并 → 自动发布
      # # 👇 使用 Changesets 自动发布
      # - name: Create Release Pull Request or Publish
      #   id: changesets
      #   uses: changesets/action@v1
      #   with:
      #     publish: pnpm run release
      #     commit: 'chore(release): publish packages'
      #     title: 'chore(release): publish packages'
      #   env:
      #     # 用于 GitHub Releases API
      #     GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
      #     # NPM 令牌，用于发布到 npmjs.com， 定期更新
      #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # END：release PR 模式： changeset自动提 PR → 人工合并 → 自动发布

      # 全自动发布 （生成 changelog、版本升级、构建、提交、推送、发布）
      - name: Publish packages
        if: steps.check_changesets.outputs.has_changesets == 'true'
        run: |
          # 1. 生成 changelog + 升级版本
          pnpm exec changeset version
          # 2. 用新版本构建（可选但推荐）
          pnpm run build:all
          # 3. 添加到暂存区并提交
          git add .
          # lint-staged 会阻止 CI 提交，这里跳过钩子
          git commit --no-verify  -m "chore(release): version packages"
          # 4. 推送 changelog commit + tags
          git push origin main --follow-tags
          # 5. 发布到 npm
          pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
