# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须！用于获取完整 Git 历史

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      # 👇 关键：先构建所有包（生成 dist/）
      - name: Build Packages
        run: pnpm run build

      # 👇 使用 Changesets 自动发布
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          commit: 'chore(release): publish packages'
          title: 'chore(release): publish packages'
        env:
          # GitHub ci-publish-holyer-lib 的令牌，用于推送代码
          GITHUB_TOKEN: ${{ secrets.ci-publish-holyer-lib }}
          # NPM 令牌，用于发布到 npmjs.com， 定期更新
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}