name: Deploy Docs to GitHub Pages

on:
  # 触发条件：推送到 main 分支
  push:
    branches: [main]
    # 可选：仅当 docs/ 或 .vuepress/ 目录变更时触发
    paths:
      - 'docs/**'
      - '.vuepress/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'

  # 手动触发
  workflow_dispatch:

# 设置权限（关键！）
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      # 3. 安装 pnpm
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.0'

      # 4. 安装依赖（含 Monorepo）
      - name: Install dependencies
        run: pnpm install

      # 5. 构建文档（关键步骤）
      - name: Build VuePress site
        run: pnpm docs:build
        env:
          # 避免 pnpm 在 CI 中使用交互式终端
          CI: true

      # 6. 设置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist  # VuePress 默认输出目录

      # 8. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 9. （可选）打印部署 URL
      - name: Show deployment URL
        run: |
          echo "✅ Docs deployed to: https://${{ github.repository }}.github.io/"
