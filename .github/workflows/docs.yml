name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs/.vuepress/**'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

# 关键：确保有正确的权限
permissions:
  contents: read
  pages: write  # 必须有 write 权限
  id-token: write # 必须有 write 权限

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.12.0
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm


      # 4. 安装依赖（含 Monorepo）
      - name: Install dependencies
        run: pnpm install

      # 5. 构建文档（关键步骤）
      - name: Build VuePress site
        run: pnpm docs:build
        env:
          # 避免 pnpm 在 CI 中使用交互式终端
          CI: true

      # 6. 设置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # VuePress 默认输出目录
          path: docs/.vuepress/dist

      # 8. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 9. （可选）打印部署 URL
      - name: Show deployment URL
        run: |
          echo "✅ Docs deployed to: https://qlhuo.github.io/holyer-lib"
